serives:
  postgres:
    image: postgres:16
    container_name: secureai-postgres
     
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureai
      POSTGRES_PASSWORD: secureai_dev_password
      POSTGRES_DB: secureai_db

    ports:
     - "5432:5432"
    volumes:
      - secureai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U secureai -d secureai_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  secureai_postgres_data: